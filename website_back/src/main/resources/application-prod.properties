management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

store.upload.galeria-dir=${STORE_UPLOAD_GALERIA_DIR:/app/uploads/galeria}
store.upload.theme-assets-dir=${STORE_UPLOAD_THEME_ASSETS_DIR:/app/uploads/theme-assets}
store.upload.android-assets-dir=${STORE_UPLOAD_ANDROID_ASSETS_DIR:/app/uploads/android-assets}
store.upload.android-private-dir=${STORE_UPLOAD_ANDROID_PRIVATE_DIR:/app/uploads/android-private}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
app.websocket.allowed-origins=${APP_WEBSOCKET_ALLOWED_ORIGINS}
app.firebase.enabled=${APP_FIREBASE_ENABLED:false}
app.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:/app/uploads/android-private/firebase-adminsdk.json}
