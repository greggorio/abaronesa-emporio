# ===============================
# = EMPORIO - WEBSITE APPLICATION
# ===============================
spring.application.name=emporio-website-backend
server.port=8085

# ===============================
# = PROFILES
# ===============================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ===============================
# = INTERNATIONALIZATION
# ===============================
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.cache-duration=3600
app.default-locale=pt-BR

# ===============================
# = DATABASE
# ===============================
# ESTE BACKEND (SITE PUBLICO) e o backend (ERP) DEVEM apontar para bancos distintos.
#   website_back   -> emporio_website_db  (site publico: theme, quiz_sessions, categories, etc.)
#   backend (ERP)  -> emporio_db          (ERP/dominio: produto, mesa, pedido, estoque, nfe, etc.)
# Apontar os dois para o mesmo banco causa divergencia de Flyway porque os
# historicos de migration sao completamente diferentes.
#
# Em caso de duvida, ver docs/architecture/VISAO_GERAL_INTEGRACOES.md e
# docs/S01-inventario-e-contratos-reais (schema esperado por servico).
spring.datasource.url=jdbc:postgresql://localhost:5432/emporio_website_db
spring.datasource.username=${DB_USERNAME:gregorio}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# = JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ===============================
# = FLYWAY
# ===============================
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# ===============================
# = CORS
# ===============================
app.cors.allowed-origins=http://localhost:5173,http://192.168.123.18:5173

# ===============================
# = WEBSOCKET
# ===============================
app.websocket.allowed-origins=http://localhost:5173,http://192.168.123.18:5173

# ===============================
# = FRONTEND
# ===============================
app.frontend.url=http://192.168.123.18:5173
app.default-tenant-id=emporio
app.fallback-tenant-ids=emporio

# ===============================
# = JWT CONFIGURATION (compartilhado com ERP)
# ===============================
# DEVE SER IGUAL AO ERP
integration.system-token-secret=${INTEGRATION_SYSTEM_TOKEN_SECRET}
jwt.expiration=86400000
jwt.header=Authorization
jwt.prefix=Bearer

# ===============================
# = ERP INTEGRATION
# ===============================
erp.api.url=${ERP_API_URL:http://localhost:8080}

# ===============================
# = UBER DIRECT
# ===============================
uber.client-id=${UBER_CLIENT_ID:}
uber.client-secret=${UBER_CLIENT_SECRET:}
uber.customer-id=${UBER_CUSTOMER_ID:}
uber.scope=${UBER_SCOPE:delivery}
uber.access-token=${UBER_ACCESS_TOKEN:}
uber.pickup-address=${UBER_PICKUP_ADDRESS:Rua Alice Rodrigues Moreira 75, Sorocaba, SP}
uber.pickup-name=${UBER_PICKUP_NAME:SmartData Test Pickup}
uber.pickup-phone=${UBER_PICKUP_PHONE:+5515996328201}
uber.pickup-notes=${UBER_PICKUP_NOTES:}
uber.pickup-ready-path=${UBER_PICKUP_READY_PATH:/v1/customers/%s/deliveries/%s}

# ===============================
# = ERP SYNC API KEY
# ===============================
website.sync.api-key=${WEBSITE_ERP_SYNC_KEY:}

# ===============================
# = SWAGGER / OPENAPI
# ===============================
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# ===============================
# = LOGGING
# ===============================
logging.level.com.baronesa.website=DEBUG
logging.level.org.springframework.messaging=DEBUG
logging.level.org.springframework.web.socket=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
store.upload.base-url=http://localhost:8085/
store.upload.theme-assets-dir=uploads/theme-assets
store.upload.android-assets-dir=uploads/android-assets
store.upload.android-private-dir=uploads/android-private

# ===============================
# = MULTIPART UPLOAD LIMITS
# ===============================
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# ===============================
# = REDEPLOY AUTOMATION
# ===============================
app.redeploy.enabled=${APP_REDEPLOY_ENABLED:false}
app.redeploy.trigger-path=${APP_REDEPLOY_TRIGGER_PATH:/app/redeploy}
app.redeploy.status-file=${APP_REDEPLOY_STATUS_FILE:.redeploy_status}
