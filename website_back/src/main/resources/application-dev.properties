# ===================================================================
# DEVELOPMENT profile - DEFAULT FALLBACKS ONLY
# ===================================================================
# Estes defaults existem APENAS para facilitar o boot local.
# Em qualquer ambiente compartilhado (staging, homolog, prod) as variaveis
# DEvem ser injetadas via ambiente - nunca confie neste arquivo.
#
# Veja docs/development/CONFIGURACAO_LOCAL_SEGREDOS.md para o procedimento
# correto de configuracao local de segredos.

integration.system-token-secret=${INTEGRATION_SYSTEM_TOKEN_SECRET:dev-local-integration-token-secret-nao-usar-fora-de-desenvolvimento}

# DB local com mesmas credenciais do seu usuario (igual ao application.properties)
# IMPORTANTE: este banco e o emporio_db do backend (ERP) sao DISTINTOS.
# Ver bloco de comentario em application.properties deste mesmo diretorio.
spring.datasource.url=jdbc:postgresql://localhost:5432/emporio_website_db
spring.datasource.username=${DB_USERNAME:gregorio}
spring.datasource.password=${DB_PASSWORD:dev-local-db-password-nao-usar-fora-de-desenvolvimento}
