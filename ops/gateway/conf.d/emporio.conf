upstream erp_backend { server backend:8080; }
upstream website_backend { server website_back:8085; }
upstream erp_frontend { server frontend:80; }
upstream website_frontend { server website_front:80; }

server {
  listen 8080 default_server;
  server_name _;
  location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }
  location / { return 444; }
}

server {
  listen 8080;
  server_name erp-emporio.abaronesa.net.br;
  client_max_body_size 10m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /healthz { access_log off; return 200 "ok\n"; }
  location ^~ /api/deployment-control/ { return 404; }

  location = /ws { include /etc/nginx/proxy-websocket.conf; proxy_pass http://erp_backend; }
  location ^~ /ws/ { include /etc/nginx/proxy-websocket.conf; proxy_pass http://erp_backend; }

  location ^~ /api/ { include /etc/nginx/proxy-common.conf; proxy_buffering off; proxy_pass http://erp_backend; }
  location ^~ /media/ { include /etc/nginx/proxy-common.conf; proxy_pass http://erp_backend; }
  location ^~ /oauth2/ { include /etc/nginx/proxy-common.conf; proxy_pass http://erp_backend; }
  location ^~ /login/oauth2/ { include /etc/nginx/proxy-common.conf; proxy_pass http://erp_backend; }
  location / { include /etc/nginx/proxy-common.conf; proxy_pass http://erp_frontend; }
}

server {
  listen 8080;
  server_name emporio.abaronesa.net.br;
  client_max_body_size 2m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /healthz { access_log off; return 200 "ok\n"; }
  location ^~ /api/deployment-control/ { return 404; }

  location = /ws { include /etc/nginx/proxy-websocket.conf; proxy_pass http://website_backend; }
  location ^~ /ws/ { include /etc/nginx/proxy-websocket.conf; proxy_pass http://website_backend; }

  location ^~ /api/ { include /etc/nginx/proxy-common.conf; proxy_buffering off; proxy_pass http://website_backend; }
  location ^~ /media/ { include /etc/nginx/proxy-common.conf; proxy_pass http://website_backend; }
  location / { include /etc/nginx/proxy-common.conf; proxy_pass http://website_frontend; }
}
