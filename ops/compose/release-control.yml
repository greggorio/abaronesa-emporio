name: emporio-release-control

services:
  release_control_postgresql:
    image: ${RELEASE_CONTROL_POSTGRES_IMAGE:-postgres:16.6-alpine}
    environment:
      POSTGRES_DB: ${RELEASE_CONTROL_DB_NAME:-emporio_release_control}
      POSTGRES_USER: ${RELEASE_CONTROL_DB_USER:-release_control_runtime}
      POSTGRES_PASSWORD: ${RELEASE_CONTROL_DB_PASSWORD:-__SET_IN_PROTECTED_ENV_FILE__}
    volumes:
      - release_control_postgresql_data:/var/lib/postgresql/data
    networks:
      - release_control_internal
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  release_control:
    image: ${RELEASE_CONTROL_IMAGE:-emporio-release-control:package-placeholder}
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    ports:
      - "127.0.0.1:${RELEASE_CONTROL_LOOPBACK_PORT:-8180}:8080"
    environment:
      RELEASE_CONTROL_PROFILE: ${RELEASE_CONTROL_PROFILE:-runtime}
      RELEASE_CONTROL_MODE: ${RELEASE_CONTROL_MODE:-deployer}
      RELEASE_CONTROL_DB_HOST: ${RELEASE_CONTROL_DB_HOST:-release_control_postgresql}
      RELEASE_CONTROL_DB_PORT: ${RELEASE_CONTROL_DB_PORT:-5432}
      RELEASE_CONTROL_DB_NAME: ${RELEASE_CONTROL_DB_NAME:-emporio_release_control}
      RELEASE_CONTROL_DB_USER: ${RELEASE_CONTROL_DB_USER:-release_control_runtime}
      RELEASE_CONTROL_DB_PASSWORD: ${RELEASE_CONTROL_DB_PASSWORD:-__SET_IN_PROTECTED_ENV_FILE__}
      RELEASE_CONTROL_DB_SSLMODE: ${RELEASE_CONTROL_DB_SSLMODE:-require}
      RELEASE_CONTROL_JWT_ISSUER: ${RELEASE_CONTROL_JWT_ISSUER:-https://control.example.invalid/api/release-control/identity/deployer}
      RELEASE_CONTROL_JWT_AUDIENCE: ${RELEASE_CONTROL_JWT_AUDIENCE:-emporio-release-control-deployer}
      RELEASE_CONTROL_JWT_JWKS_URL: ${RELEASE_CONTROL_JWT_JWKS_URL:-https://control.example.invalid/api/release-control/identity/deployer/jwks}
      RELEASE_CONTROL_CORS_ORIGINS: ${RELEASE_CONTROL_CORS_ORIGINS:-https://ui.example.invalid}
      RELEASE_CONTROL_GITHUB_APP_ID: ${RELEASE_CONTROL_GITHUB_APP_ID:-1}
      RELEASE_CONTROL_GITHUB_INSTALLATION_ID: ${RELEASE_CONTROL_GITHUB_INSTALLATION_ID:-1}
      RELEASE_CONTROL_GITHUB_PRIVATE_KEY_PATH: /run/secrets/github-app-private-key
      RELEASE_CONTROL_HASH_PEPPER: ${RELEASE_CONTROL_HASH_PEPPER:-__SET_IN_PROTECTED_ENV_FILE__}
      RELEASE_CONTROL_GITHUB_API_BASE: ${RELEASE_CONTROL_GITHUB_API_BASE:-https://api.github.com}
      RELEASE_CONTROL_RECONCILE_INTERVAL_SECONDS: ${RELEASE_CONTROL_RECONCILE_INTERVAL_SECONDS:-15}
      RELEASE_CONTROL_DISPATCH_DISCOVERY_TIMEOUT_SECONDS: ${RELEASE_CONTROL_DISPATCH_DISCOVERY_TIMEOUT_SECONDS:-600}
      RELEASE_CONTROL_HTTP_CONNECT_TIMEOUT_SECONDS: ${RELEASE_CONTROL_HTTP_CONNECT_TIMEOUT_SECONDS:-3}
      RELEASE_CONTROL_HTTP_READ_TIMEOUT_SECONDS: ${RELEASE_CONTROL_HTTP_READ_TIMEOUT_SECONDS:-10}
      RELEASE_CONTROL_GITHUB_MAX_PAGES: ${RELEASE_CONTROL_GITHUB_MAX_PAGES:-10}
      RELEASE_CONTROL_IDEMPOTENCY_RETENTION_DAYS: ${RELEASE_CONTROL_IDEMPOTENCY_RETENTION_DAYS:-365}
      RELEASE_CONTROL_READ_RATE_PER_MINUTE: ${RELEASE_CONTROL_READ_RATE_PER_MINUTE:-120}
      RELEASE_CONTROL_PUBLISH_RATE_PER_MINUTE: ${RELEASE_CONTROL_PUBLISH_RATE_PER_MINUTE:-5}
      RELEASE_CONTROL_DEPLOY_RATE_PER_MINUTE: ${RELEASE_CONTROL_DEPLOY_RATE_PER_MINUTE:-5}
      RELEASE_CONTROL_ROLLBACK_RATE_PER_MINUTE: ${RELEASE_CONTROL_ROLLBACK_RATE_PER_MINUTE:-2}
      RELEASE_CONTROL_MAX_JSON_BODY_BYTES: ${RELEASE_CONTROL_MAX_JSON_BODY_BYTES:-16384}
    secrets:
      - source: release_control_github_app_private_key
        target: github-app-private-key
        mode: 0440
    depends_on:
      release_control_postgresql:
        condition: service_healthy
    networks:
      - release_control_internal
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live', timeout=2).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

secrets:
  release_control_github_app_private_key:
    external: true
    name: ${RELEASE_CONTROL_GITHUB_SECRET_NAME:-emporio_release_control_github_app_private_key}

volumes:
  release_control_postgresql_data:
    name: emporio_release_control_postgresql_data

networks:
  release_control_internal:
    name: emporio_release_control_internal
