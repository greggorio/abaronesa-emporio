name: Verify Deployment Engine
run-name: verify-deployment-engine-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emporio-deployment-engine-rehearsal
  cancel-in-progress: false

jobs:
  trust:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate trusted rehearsal dispatch
        env:
          TRUSTED_REPOSITORY: ${{ github.repository }}
          TRUSTED_WORKFLOW_REF: ${{ github.workflow_ref }}
          TRUSTED_EVENT: ${{ github.event_name }}
          TRUSTED_REF: ${{ github.ref }}
          TRUSTED_SHA: ${{ github.sha }}
          TRUSTED_RUN_ID: ${{ github.run_id }}
          TRUSTED_RUN_ATTEMPT: ${{ github.run_attempt }}
          TRUSTED_ACTOR: ${{ github.actor }}
          TRUSTED_ACTOR_ID: ${{ github.actor_id }}
          TRUSTED_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          TRUSTED_SENDER_ID: ${{ github.event.sender.id }}
          DEPLOYER_ACTOR_IDS: ${{ vars.DEPLOYER_ACTOR_IDS }}
        run: python3 tools/deploy/deployment_engine_rehearsal.py trust --output trust
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deployment-engine-trust
          path: trust/
          if-no-files-found: error
          retention-days: 90
          overwrite: false

  rehearse:
    needs: trust
    permissions:
      contents: read
      actions: read
      packages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: deployment-engine-trust
          path: trust
      - name: Download the immutable v0.1.1 release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          install -d -m 0700 release-assets
          gh api /repos/greggorio/abaronesa-emporio/releases/365219520 > release-assets/release-record.json
          gh api /repos/greggorio/abaronesa-emporio/git/ref/tags/v0.1.1 > release-assets/tag-ref.json
          gh release download v0.1.1 --repo greggorio/abaronesa-emporio --dir release-assets --pattern metadata.json --pattern release.json --pattern release.json.sha256
      - name: Authenticate the ephemeral runner to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Normalize the ephemeral Docker config permissions
        run: |
          chmod 0700 "$HOME/.docker"
          chmod 0600 "$HOME/.docker/config.json"
          test "$(stat -c '%a' "$HOME/.docker")" = 700
          test "$(stat -c '%a' "$HOME/.docker/config.json")" = 600
      - name: Execute the real isolated deployment transaction
        id: rehearsal
        continue-on-error: true
        env:
          TRUSTED_REPOSITORY: ${{ github.repository }}
          TRUSTED_WORKFLOW_REF: ${{ github.workflow_ref }}
          TRUSTED_RUN_ID: ${{ github.run_id }}
          TRUSTED_RUN_ATTEMPT: ${{ github.run_attempt }}
          TRUSTED_SHA: ${{ github.sha }}
          TRUSTED_ACTOR_ID: ${{ github.actor_id }}
        run: python3 tools/deploy/deployment_engine_rehearsal.py rehearse --trust trust --assets release-assets --output rehearsal
      - name: Logout from GHCR
        id: logout
        if: always()
        run: docker logout ghcr.io
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: deployment-engine-rehearsal
          path: rehearsal/
          if-no-files-found: error
          retention-days: 90
          overwrite: false
      - name: Enforce rehearsal success after preserving evidence
        if: steps.rehearsal.outcome != 'success' || steps.logout.outcome != 'success'
        run: exit 1

  outcome:
    if: always()
    needs: [trust, rehearse]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        if: needs.trust.result == 'success'
        continue-on-error: true
        with:
          name: deployment-engine-trust
          path: trust
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        if: needs.trust.result == 'success'
        continue-on-error: true
        with:
          name: deployment-engine-rehearsal
          path: rehearsal
      - name: Record the rehearsal outcome without inventing success
        env:
          TRUSTED_REPOSITORY: ${{ github.repository }}
          TRUSTED_WORKFLOW_REF: ${{ github.workflow_ref }}
          TRUSTED_RUN_ID: ${{ github.run_id }}
          TRUSTED_RUN_ATTEMPT: ${{ github.run_attempt }}
          TRUSTED_SHA: ${{ github.sha }}
          TRUSTED_ACTOR_ID: ${{ github.actor_id }}
          TRUST_RESULT: ${{ needs.trust.result }}
          REHEARSAL_RESULT: ${{ needs.rehearse.result }}
        run: python3 tools/deploy/deployment_engine_rehearsal.py outcome --trust trust --rehearsal rehearsal --output outcome
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: deployment-engine-rehearsal-outcome
          path: outcome/
          if-no-files-found: error
          retention-days: 90
          overwrite: false
