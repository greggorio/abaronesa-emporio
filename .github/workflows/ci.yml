name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      resolution: ${{ steps.resolve.outputs.resolution }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Install fixed contract dependencies
        run: python3 -m pip install -r tools/releases/requirements.txt
      - name: Resolve changed paths fail-closed
        id: resolve
        run: python3 tools/ci/resolve_changes.py --output candidate-plan/resolution.json
      - name: Generate and validate candidate plan
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python3 tools/candidates/candidate_plan.py generate --resolution candidate-plan/resolution.json --output candidate-plan/candidate-plan.json
          python3 tools/candidates/candidate_plan.py validate --plan candidate-plan/candidate-plan.json
      - name: Persist candidate plan for trusted publisher
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: candidate-plan
          path: candidate-plan/candidate-plan.json
          if-no-files-found: error
          retention-days: 7
          overwrite: false

  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Install fixed contract dependencies
        run: python3 -m pip install -r tools/releases/requirements.txt
      - name: Validate CI and candidate contract
        run: |
          python3 tools/ci/validate_ci.py
          python3 tools/ci/migrations_contract.py
          python3 tools/releases/candidate_manifest.py validate --manifest ops/releases/examples/candidate-manifest.example.json
      - name: Validate accepted infrastructure contracts
        run: |
          python3 tools/releases/catalog.py validate --require-release-ready
          python3 -m unittest discover -s tools/releases/tests -v
          python3 tools/releases/release_control_contract.py
          python3 tools/security/bootstrap_contract.py
          python3 -m unittest discover -s tools/security/tests -v
          python3 tools/docker/java_images_contract.py
          python3 -m unittest discover -s tools/docker/tests -v
          python3 tools/compose/validate_compose.py
          python3 -m unittest discover -s tools/compose/tests -v
          python3 tools/gateway/validate_gateway.py
          python3 -m unittest discover -s tools/gateway/tests -v
      - name: Scan tracked files and available history for secrets
        run: python3 tools/ci/secret_scan.py --tracked

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify ERP backend
        working-directory: backend
        run: mvn -B verify

  website_back:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify website backend
        working-directory: website_back
        run: mvn -B verify

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up Node 24
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, lint, test and build ERP frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run test
          npm run build

  website_front:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up Node 24
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: website_front/package-lock.json
      - name: Install, test and build website frontend
        working-directory: website_front
        run: |
          npm ci
          npm run test
          npm run build

  whatsapp:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up Node 24
        uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: whatsapp_service/package-lock.json
      - name: Install, check and test WhatsApp service
        working-directory: whatsapp_service
        run: |
          npm ci
          node --check index.js
          node --check app.js
          npm run test

  images:
    needs: [plan, contracts, backend, website_back, frontend, website_front, whatsapp]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: backend
            dockerfile: backend/Dockerfile
          - component: website_back
            context: website_back
            dockerfile: website_back/Dockerfile
          - component: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
          - component: website_front
            context: website_front
            dockerfile: website_front/Dockerfile
          - component: whatsapp_service
            context: whatsapp_service
            dockerfile: whatsapp_service/Dockerfile
          - component: gateway
            context: ops/gateway
            dockerfile: ops/gateway/Dockerfile
    steps:
      - name: Checkout full history
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Build linux amd64 image locally
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          push: false
          tags: abaronesa-emporio-ci-${{ matrix.component }}:ci-${{ github.sha }}
          build-args: |
            VCS_REF=${{ github.sha }}
            IMAGE_VERSION=ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Scan image for HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: abaronesa-emporio-ci-${{ matrix.component }}:ci-${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          trivy-version: v0.70.0
          cache: false
      - name: Remove only the local CI image
        if: always()
        run: docker image rm -f abaronesa-emporio-ci-${{ matrix.component }}:ci-${{ github.sha }}
