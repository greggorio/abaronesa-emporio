# Test configuration using PostgreSQL
# Using local PostgreSQL instance on port 5432

spring.datasource.url=jdbc:postgresql://localhost:5432/testdb
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=test
spring.datasource.password=test

# JPA/Hibernate configuration for tests
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Disable Flyway for tests (using create-drop instead)
spring.flyway.enabled=false

# Disable OAuth2 for tests
spring.security.oauth2.client.registration.google.client-id=test
spring.security.oauth2.client.registration.google.client-secret=test

# Segredo efemero do processo de teste; nao e valor operacional nem persistido.
integration.system-token-secret=${random.uuid}${random.uuid}
app.cors.allowed-origins=http://127.0.0.1:4173

# Disable external integrations
espresso.sync.base-url=http://localhost:8085
espresso.sync.api-key=test-key

# Disable job scheduler for tests
app.job-scheduler.enabled=false

# Disable data seeders for tests (they cause Hibernate issues with create-drop)
app.seeders.enabled=false

app.release-control.identity.enabled=${RELEASE_CONTROL_IDENTITY_ENABLED:false}
app.release-control.identity.issuer=${RELEASE_CONTROL_IDENTITY_ISSUER:}
app.release-control.identity.private-key-path=${RELEASE_CONTROL_IDENTITY_PRIVATE_KEY_PATH:}
app.release-control.identity.key-id=${RELEASE_CONTROL_IDENTITY_KEY_ID:}

app.release-control.deployer-identity.enabled=${RELEASE_CONTROL_DEPLOYER_IDENTITY_ENABLED:false}
app.release-control.deployer-identity.issuer=${RELEASE_CONTROL_DEPLOYER_IDENTITY_ISSUER:}
app.release-control.deployer-identity.private-key-path=${RELEASE_CONTROL_DEPLOYER_IDENTITY_PRIVATE_KEY_PATH:}
app.release-control.deployer-identity.key-id=${RELEASE_CONTROL_DEPLOYER_DEPLOYER_IDENTITY_KEY_ID:}

# Fixtures efemeras exclusivas do processo de teste.
store.upload.dir=${java.io.tmpdir}/emporio-s07-test/uploads
store.upload.produto-dir=${java.io.tmpdir}/emporio-s07-test/uploads/produtos
store.upload.certificado-dir=${java.io.tmpdir}/emporio-s07-test/uploads/certificados
store.upload.signage-ai-dir=${java.io.tmpdir}/emporio-s07-test/uploads/signage-ai
app.fiscal.nfe-schema-path=${java.io.tmpdir}/emporio-s07-test/nfe/schemas
app.fiscal.nfe-xml-path=${java.io.tmpdir}/emporio-s07-test/nfe/xmls

# Logging
logging.level.com.baronesa.emporio=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.springframework=INFO
