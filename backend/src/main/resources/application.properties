# Configuração básica da aplicação
spring.application.name=cafe-backend

# Bootstrap administrativo opt-in; credenciais somente por ambiente.
app.bootstrap.root.enabled=${ROOT_BOOTSTRAP_ENABLED:false}
app.bootstrap.root.name=${ROOT_BOOTSTRAP_NAME:Root}
app.bootstrap.root.email=${ROOT_BOOTSTRAP_EMAIL:}
app.bootstrap.root.password=${ROOT_BOOTSTRAP_PASSWORD:}

# Ponte de identidade do publisher: opt-in e fail-closed.
app.release-control.identity.enabled=${RELEASE_CONTROL_IDENTITY_ENABLED:false}
app.release-control.identity.issuer=${RELEASE_CONTROL_IDENTITY_ISSUER:}
app.release-control.identity.private-key-path=${RELEASE_CONTROL_IDENTITY_PRIVATE_KEY_PATH:}
app.release-control.identity.key-id=${RELEASE_CONTROL_IDENTITY_KEY_ID:}

# Ponte de identidade do deployer: opt-in e fail-closed.
app.release-control.deployer-identity.enabled=${RELEASE_CONTROL_DEPLOYER_IDENTITY_ENABLED:false}
app.release-control.deployer-identity.issuer=${RELEASE_CONTROL_DEPLOYER_IDENTITY_ISSUER:}
app.release-control.deployer-identity.private-key-path=${RELEASE_CONTROL_DEPLOYER_IDENTITY_PRIVATE_KEY_PATH:}
app.release-control.deployer-identity.key-id=${RELEASE_CONTROL_DEPLOYER_IDENTITY_KEY_ID:}

# Perfil ativo padrão
spring.profiles.active=dev

# Porta do servidor
server.port=8080

# Charset
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Jackson / JSON
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=dd/MM/yyyy HH:mm:ss
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.locale=pt_BR
spring.jackson.deserialization.fail-on-unknown-properties=false

# Internacionalização de dados (idiomas alvo para tradução automática)
translation.target-locales=en-US,es-ES

# ===================================================================
# UPLOAD DE ARQUIVOS
# ===================================================================
# Base URL usada para construir links públicos para mídias servidas em /media/**
store.upload.base-url=http://localhost:${server.port}/
# Diretórios para upload de imagens
store.upload.dir=${STORE_UPLOAD_DIR:uploads}
store.upload.categoria-dir=${STORE_UPLOAD_CATEGORIA_DIR:uploads/categorias}
store.upload.subcategoria-dir=${STORE_UPLOAD_SUBCATEGORIA_DIR:uploads/subcategorias}
store.upload.certificado-dir=${STORE_UPLOAD_CERTIFICADO_DIR:uploads/certificados}
store.upload.produto-dir=${STORE_UPLOAD_PRODUTO_DIR:uploads/produtos}

# Paths fiscais locais, sobrescritiveis pelas mesmas variaveis usadas no container.
app.fiscal.nfe-schema-path=${NFE_SCHEMA_PATH:nfe/schemas}
app.fiscal.nfe-xml-path=${NFE_XML_PATH:nfe/xmls}
# Limites de upload (aumentado para suportar vídeos até 100MB)
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=110MB

# ===================================================================
# PROCESSAMENTO DE VÍDEO
# ===================================================================
# Caminho para ffmpeg e ffprobe (instalados no sistema)
ffmpeg.path=/usr/bin/ffmpeg
ffprobe.path=/usr/bin/ffprobe
# Encoder de vídeo preferido (libx264 é o padrão, com fallback automático)
video.encoder=libx264

# ===================================================================
# SWAGGER / SPRINGDOC OPENAPI
# ===================================================================
# Habilitar Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Paths do Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
springdoc.swagger-ui.url=/v3/api-docs

# Configurações de UI
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Pacotes para escanear
springdoc.packagesToScan=com.baronesa.emporio
springdoc.pathsToMatch=/**

# Informações da API
springdoc.info.title=CaféTech Backend API
springdoc.info.description=API REST para gerenciamento de cafeterias
springdoc.info.version=1.0.0

# Mostrar actuator endpoints no Swagger (opcional)
springdoc.show-actuator=false

# ===================================================================
# DATABASE - PostgreSQL
# ===================================================================
# ESTE BACKEND (ERP) e o website_back DEVEM apontar para bancos distintos.
#   backend        -> emporio_db          (ERP/dominio: produto, mesa, pedido, estoque, nfe, etc.)
#   website_back   -> emporio_website_db  (site publico: theme, quiz_sessions, categories, etc.)
# Apontar os dois para o mesmo banco causa divergencia de Flyway porque os
# historicos de migration sao completamente diferentes.
#
#spring.datasource.url=jdbc:postgresql://localhost:5432/cafe_db
#spring.datasource.url=jdbc:postgresql://localhost:5432/villa_erp_db
#spring.datasource.username=postgres
# spring.datasource.password=${DB_PASSWORD}
#spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# JPA / HIBERNATE
# ===================================================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ===================================================================
# FLYWAY (Migrations)
# ===================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ===================================================================
# JWT Configuration (compartilhado com outros serviços) - DEVE SER IGUAL AO ERP
# ===================================================================
integration.system-token-secret=${INTEGRATION_SYSTEM_TOKEN_SECRET}
jwt.expiration=86400000
jwt.header=Authorization
jwt.prefix=Bearer

# ===================================================================
# OAuth2 Google
# ===================================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=profile,email

# ===================================================================
# CONFIGURACOES DE EMAIL
# ===================================================================
app.mail.enabled=true

# Configuracoes SMTP Gmail
#spring.mail.host=smtp.gmail.com
#spring.mail.port=465
#spring.mail.username=greggorio@gmail.com
# spring.mail.password=${MAIL_PASSWORD}
#spring.mail.properties.mail.smtp.auth=true
#spring.mail.properties.mail.smtp.starttls.enable=true
#spring.mail.properties.mail.smtp.socketFactory.port=465
#spring.mail.properties.mail.smtp.socketFactory.class=javax.net.ssl.SSLSocketFactory
#spring.mail.properties.mail.smtp.socketFactory.fallback=false

# Configuracoes adicionais recomendadas
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google

# ===================================================================
# URLs de redirecionamento OAuth2
# ===================================================================
erp.app.base-url=http://localhost:8084

# ===================================================================
# Uber Direct bridge (calls espresso_back)
# ===================================================================
uber.client-id=${UBER_CLIENT_ID:}
uber.client-secret=${UBER_CLIENT_SECRET:}
uber.customer-id=${UBER_CUSTOMER_ID:}
uber.scope=${UBER_SCOPE:delivery}
uber.access-token=${UBER_ACCESS_TOKEN:}
uber.pickup-address=${UBER_PICKUP_ADDRESS:Rua Alice Rodrigues Moreira 75, Sorocaba, SP}
uber.pickup-name=${UBER_PICKUP_NAME:SmartData Test Pickup}
uber.pickup-phone=${UBER_PICKUP_PHONE:+5515996328201}
uber.pickup-notes=${UBER_PICKUP_NOTES:}
uber.pickup-ready-path=${UBER_PICKUP_READY_PATH:/v1/customers/%s/deliveries/%s}
ecommerce.app.base-url=http://localhost:5173
website.app.base-url=http://localhost:5173
espresso-api.app.base-url=http://localhost:8085

# ===================================================================
# Configurações de sincronização com espresso_back
# ===================================================================
espresso.sync.base-url=${ESPRESSO_SYNC_BASE_URL:http://localhost:8085}
espresso.sync.api-key=${ESPRESSO_SYNC_API_KEY:}

# ===================================================================
# CONFIGURAÇÃO DE IMAGENS IA PARA SIGNAGE
# ===================================================================
store.upload.signage-ai-dir=${STORE_UPLOAD_SIGNAGE_AI_DIR:uploads/signage/ai}
store.upload.signage-dir=${STORE_UPLOAD_SIGNAGE_DIR:uploads/signage}
signage.ai.provider=openai
signage.ai.model=gpt-image-1
signage.ai.default-size=1024x1024
signage.render.base-url=${SIGNAGE_RENDER_BASE_URL:http://localhost:4010}

# ===================================================================
# CONFIGURAÇÃO DE INTEGRAÇÃO COM SIGNAGE-API
# ===================================================================
signage.api.url=${SIGNAGE_API_URL:http://localhost:4020}
signage.api.enabled=${SIGNAGE_API_ENABLED:true}
