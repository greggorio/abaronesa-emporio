# ===================================================================
# CONFIGURAÇÕES DE PRODUÇÃO - CAFE ERP
# ===================================================================
# Nota: Configurações do docker-compose.yml sobrescrevem estas quando aplicável
# ===================================================================

# ===================================================================
# APLICAÇÃO
# ===================================================================
spring.application.name=emporio-backend

# ===================================================================
# BANCO DE DADOS
# ===================================================================
# URL, username e password são definidos via variáveis de ambiente no docker-compose
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===================================================================
# FLYWAY (Migrations)
# ===================================================================
# Habilitado via docker-compose: SPRING_FLYWAY_ENABLED=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
# Rescue (use with caution): if the schema already exists but flyway history was wiped/emptied, baseline to latest resolved migration.
# Enable temporarily via env var: APP_FLYWAY_BASELINE_TO_LATEST_ON_EMPTY=true
# app.flyway.baseline-to-latest-on-empty=false

# ===================================================================
# LOGS - PRODUÇÃO (Menos verboso)
# ===================================================================
logging.level.root=INFO
logging.level.com.baronesa.emporio=INFO
logging.level.com.baronesa.emporio.controller.advice=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.org.hibernate.SQL=false
logging.level.org.hibernate.type.descriptor.sql=ERROR

# ===================================================================
# SWAGGER / SPRINGDOC - DESABILITADO EM PRODUÇÃO
# ===================================================================
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ===================================================================
# SEGURANÇA
# ===================================================================
# Token de integração - DEVE SER IGUAL AO ERP (mínimo 64 caracteres para HS512)
integration.system-token-secret=${INTEGRATION_SYSTEM_TOKEN_SECRET}

app.release-control.identity.enabled=${RELEASE_CONTROL_IDENTITY_ENABLED:false}
app.release-control.identity.issuer=${RELEASE_CONTROL_IDENTITY_ISSUER:}
app.release-control.identity.private-key-path=${RELEASE_CONTROL_IDENTITY_PRIVATE_KEY_PATH:}
app.release-control.identity.key-id=${RELEASE_CONTROL_IDENTITY_KEY_ID:}

app.release-control.deployer-identity.enabled=${RELEASE_CONTROL_DEPLOYER_IDENTITY_ENABLED:false}
app.release-control.deployer-identity.issuer=${RELEASE_CONTROL_DEPLOYER_IDENTITY_ISSUER:}
app.release-control.deployer-identity.private-key-path=${RELEASE_CONTROL_DEPLOYER_IDENTITY_PRIVATE_KEY_PATH:}
app.release-control.deployer-identity.key-id=${RELEASE_CONTROL_DEPLOYER_IDENTITY_KEY_ID:}

# OAuth2 Google - credenciais devem vir de variáveis de ambiente
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=profile,email
# Redirect URI sem /api/ (rota direta no nginx para OAuth2 callback)
spring.security.oauth2.client.registration.google.redirect-uri=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_REDIRECT_URI:https://espressoerp.smartdataerp.com.br/login/oauth2/code/google}

# ===================================================================
# JACKSON / JSON
# ===================================================================
# Configurações definidas via docker-compose environment variables
# SPRING_JACKSON_TIME_ZONE=America/Sao_Paulo
# SPRING_JACKSON_DATE_FORMAT=yyyy-MM-dd'T'HH:mm:ss
spring.jackson.serialization.write-dates-as-timestamps=false

# ===================================================================
# CONFIGURAÇÕES DO FRONTEND
# ===================================================================
bares.app.base-url=https://espressoerp.smartdataerp.com.br
erp.app.base-url=${ERP_BASE_URL:https://espressoerp.smartdataerp.com.br}
ecommerce.app.base-url=${ECOMMERCE_BASE_URL:https://espresso.smartdataerp.com.br}
android.app.base-url=${ANDROID_BASE_URL:https://espressoerp.smartdataerp.com.br}
website.app.base-url=${WEBSITE_BASE_URL:https://espresso.smartdataerp.com.br}
espresso-api.app.base-url=${ESPRESSO_API_BASE_URL:https://espresso.smartdataerp.com.br}


# ===================================================================
# EMAIL
# ===================================================================
app.mail.enabled=${MAIL_ENABLED:false}
app.name=${APP_NAME:Bares ERP}
app.company.name=${COMPANY_NAME:SmartData}
app.frontend.url=${APP_FRONTEND_URL:https://espressoerp.smartdataerp.com.br}

# Configurações SMTP (quando habilitado)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.gmail.com}

# ===================================================================
# UPLOAD DE ARQUIVOS (PRODUÇÃO)
# ===================================================================
store.upload.base-url=https://espressoerp.smartdataerp.com.br/
store.upload.produto-dir=${STORE_UPLOAD_PRODUTO_DIR:/app/uploads/produtos}
store.upload.certificado-dir=${STORE_UPLOAD_CERTIFICADO_DIR:/app/uploads/certificados}

app.fiscal.nfe-schema-path=${NFE_SCHEMA_PATH:/app/nfe/schemas}
app.fiscal.nfe-xml-path=${NFE_XML_PATH:/app/nfe/xmls}
app.whatsapp.service-url=${WHATSAPP_SERVICE_URL:http://whatsapp_service:3001}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# ===================================================================
# CONFIGURAÇÃO DE IMAGENS IA PARA SIGNAGE (PRODUÇÃO)
# ===================================================================
store.upload.signage-ai-dir=${STORE_UPLOAD_SIGNAGE_AI_DIR:/app/uploads/signage/ai}
signage.ai.provider=openai
signage.ai.model=gpt-image-1
signage.ai.default-size=1024x1024

# ===================================================================
# ACTUATOR - Monitoramento (Restrito)
# ===================================================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.info.enabled=true

# ===================================================================
# COMPRESSÃO E PERFORMANCE
# ===================================================================
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024

# ===================================================================
# TIMEOUT E LIMITES
# ===================================================================
spring.mvc.async.request-timeout=30000
server.tomcat.connection-timeout=20000
server.tomcat.max-connections=8192
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10

# ===================================================================
# UPLOAD LIMITS
# ===================================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
