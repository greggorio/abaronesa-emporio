# ===================================================================
# CONFIGURAÇÕES BÁSICAS DA APLICAÇÃO
# ===================================================================
server.port=8080
spring.application.name=emporio-backend

# ===================================================================
# BANCO DE DADOS
# ===================================================================
# cafe_erp_db pertence a outra instalacao da mesma solucao; o desenvolvimento
# deste produto usa emporio_db. Host, banco e usuario ficam sobrescreviveis para
# que cada maquina aponte para a sua instancia sem editar arquivo versionado.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:emporio_db}
spring.datasource.username=${DB_USER:postgres}
# Postgres local costuma usar trust/peer: senha vazia por padrao.
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none

# ===================================================================
# FLYWAY (Migrations)
# ===================================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=true
# Rescue: if the schema already exists but flyway history was wiped/emptied, baseline to latest resolved migration.
# Enable temporarily via env var: APP_FLYWAY_BASELINE_TO_LATEST_ON_EMPTY=true
# app.flyway.baseline-to-latest-on-empty=false

# ===================================================================
# LOGS
# ===================================================================
logging.level.org.hibernate.SQL=false
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.transaction=DEBUG
logging.level.com.baronesa.emporio.service=DEBUG
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate.type.descriptor.sql=ERROR
# Debug para Springdoc/Swagger
logging.level.org.springdoc=DEBUG
logging.level.org.springframework.web=DEBUG

# ===================================================================
# SWAGGER / SPRINGDOC OPENAPI
# ===================================================================
# Habilitar Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Paths do Swagger
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config

# Configurações de UI
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Pacotes para escanear
springdoc.packagesToScan=com.baronesa.emporio
springdoc.pathsToMatch=/**

# Informações da API
springdoc.info.title=Bares Backend API
springdoc.info.description=API REST para gerenciamento de bares
springdoc.info.version=1.0.0

# Mostrar actuator endpoints no Swagger (opcional)
springdoc.show-actuator=false

# ===================================================================
# CONFIGURAÇÕES DO FRONTEND
# ===================================================================
bares.app.base-url=http://localhost:8084

erp.app.base-url=${ERP_BASE_URL:http://localhost:8084}
ecommerce.app.base-url=${ECOMMERCE_BASE_URL:http://localhost:5173}
android.app.base-url=${ANDROID_BASE_URL:http://localhost:9000}
android.app.custom-scheme=${ANDROID_CUSTOM_SCHEME:capacitor://localhost}
espresso-api.app.base-url=${ESPRESSO_API_BASE_URL:http://localhost:8085}

# ===================================================================
# SEGURANÇA E AUTENTICAÇÃO
# ===================================================================
# Token de integração
# Sem default, o perfil dev nao subia: o placeholder nao resolvia e o
# jwtTokenProvider nao era criado. Valor local e inerte, so assina tokens de
# desenvolvimento; producao continua exigindo a variavel.
integration.system-token-secret=${INTEGRATION_SYSTEM_TOKEN_SECRET:dev-local-integration-token-secret-nao-usar-fora-de-desenvolvimento}

# Semeia o root SYSTEM numa base vazia, para que o perfil dev suba utilizavel
# sem passo manual. Producao mantem o default desligado em
# application.properties e exige as variaveis do operador.
app.bootstrap.root.enabled=${ROOT_BOOTSTRAP_ENABLED:true}
app.bootstrap.root.name=${ROOT_BOOTSTRAP_NAME:Root}
app.bootstrap.root.email=${ROOT_BOOTSTRAP_EMAIL:root@localhost}
app.bootstrap.root.password=${ROOT_BOOTSTRAP_PASSWORD:123456}

# A ponte fica ligada em desenvolvimento: a UI publisher a usa para trocar o
# token ERP por um RS256, e desligada ela responde 404 sem explicar por que.
# Emissor, chave e key-id assumem o caminho convencional, e a chave e criada na
# primeira subida, fora do repositorio — subir o perfil dev nao exige exportar
# variavel alguma. Producao mantem tudo desligado em application.properties.
app.release-control.identity.enabled=${RELEASE_CONTROL_IDENTITY_ENABLED:true}
# A aplicacao cria a chave do emissor na primeira subida, fora do repositorio,
# para que o perfil dev nao dependa de passo manual nem de variavel lembrada.
app.release-control.identity.generate-key-if-absent=${RELEASE_CONTROL_IDENTITY_GENERATE_KEY:true}
app.release-control.identity.issuer=${RELEASE_CONTROL_IDENTITY_ISSUER:http://127.0.0.1:8080/api/release-control/identity}
app.release-control.identity.private-key-path=${RELEASE_CONTROL_IDENTITY_PRIVATE_KEY_PATH:${user.home}/.config/emporio/release-control/publisher-identity.pem}
app.release-control.identity.key-id=${RELEASE_CONTROL_IDENTITY_KEY_ID:emporio-dev-publisher-identity}

app.release-control.deployer-identity.enabled=${RELEASE_CONTROL_DEPLOYER_IDENTITY_ENABLED:false}
app.release-control.deployer-identity.issuer=${RELEASE_CONTROL_DEPLOYER_IDENTITY_ISSUER:}
app.release-control.deployer-identity.private-key-path=${RELEASE_CONTROL_DEPLOYER_IDENTITY_PRIVATE_KEY_PATH:}
app.release-control.deployer-identity.key-id=${RELEASE_CONTROL_DEPLOYER_IDENTITY_KEY_ID:}

# SecurityConfig exige esta propriedade sem default, e ate agora ela so existia
# em application-prod.properties: o perfil dev nao subia sem exportar a variavel
# a mao. O default cobre o frontend local; a variavel continua sobrescrevendo.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8084,http://127.0.0.1:8084}

# OAuth2 Google
# O auto-config recusa registro declarado com client id vazio.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dev-local.invalid}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dev-local-secret}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=http://localhost:8080/login/oauth2/code/google

# ===================================================================
# JACKSON / JSON
# ===================================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=dd/MM/yyyy HH:mm:ss
spring.jackson.time-zone=America/Sao_Paulo

springdoc.swagger-ui.url=/v3/api-docs


# ===================================================================
# UPLOAD DE ARQUIVOS (DEV) - somente produtos nesta fase
# ===================================================================
store.upload.base-url=http://localhost:${server.port}/
store.upload.produto-dir=${STORE_UPLOAD_PRODUTO_DIR:uploads/produtos}
store.upload.certificado-dir=${STORE_UPLOAD_CERTIFICADO_DIR:uploads/certificados}

# ===================================================================
# CONFIGURAÇÃO DE IMAGENS IA PARA SIGNAGE (DEV)
# ===================================================================
store.upload.signage-ai-dir=${STORE_UPLOAD_SIGNAGE_AI_DIR:uploads/signage/ai}
signage.ai.provider=openai
signage.ai.model=gpt-image-1
signage.ai.default-size=1024x1024
